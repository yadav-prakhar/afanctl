name: Feature request
description: Suggest an idea for afanctl
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Note the project scope: **one fan, one machine class** (pre-T2 Intel Mac
        via `applesmc`). Multi-fan, `auto-intervene` mode, and the omafan plugin
        are tracked as deferred work — check the wiki
        [Background and Verification](https://github.com/yadav-prakhar/afanctl/wiki/Background-and-Verification)
        page first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? Sketch the CLI/config surface if you can.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: How does this interact with "fail toward the firmware"? Any new failure paths, and where do they end (AUTO / refuse-to-start / loud log)?
